name: FX AEGIS AI · Historical Refresh, Test & Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-and-pages.yml'
      - 'github_pipeline.py'
      - 'history20.py'
      - 'docs/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-repro.txt'
      - 'repro_lab.py'
      - 'self_evolve.py'
      - 'research/**'
  schedule:
    # UTC 02:13 = JST 11:13; weekdays. Scheduled jobs may be delayed.
    - cron: '13 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fx-aegis-research-pages
  cancel-in-progress: false

jobs:
  refresh-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install exact reproducibility environment
        run: pip install -r requirements-repro.txt
      - name: Generate reproducible synthetic fixture (test-only)
        run: |
          python generate_demo.py
          python main.py --csv data/demo_synthetic_usdjpy.csv --strategy trend --out results/demo_trend
      - name: Run research and simulation tests
        run: python -m unittest discover -s tests -v
      - name: Download official FRED DEXJPUS and validate provenance
        run: python github_pipeline.py refresh
      - name: Replay proof and parameter stability scan on verified historical data
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          mkdir -p research
          python repro_lab.py capture --out research/repro_latest.json --fast 15 --slow 100 --allocation 0.25 --spread-pips 1.4
          python repro_lab.py verify --proof research/repro_latest.json
          python repro_lab.py scan --out research/scan_latest.json --seed 42 --spread-pips 1.4
          python repro_lab.py publish --proof research/repro_latest.json --scan research/scan_latest.json --out docs/data/reproducibility.json
      - name: Evolve research-only agents against pre-2021 folds; lock new challengers for forward paper evidence
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python self_evolve.py --population 16 --generations 5 --seed 42 --seed-mode weekly --spread-pips 1.4
      - name: Produce static read-only website and scenario payload
        run: python github_pipeline.py build
      - name: Persist reference history and publication JSON in Git history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A datasets/fred/dexjpus_daily.csv datasets/fred/metadata.json docs/data/research.json docs/data/reproducibility.json docs/data/evolution.json research/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified FRED USDJPY reference snapshot [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: refresh-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
