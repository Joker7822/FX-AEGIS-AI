name: FX AEGIS AI · Historical Refresh, Test & Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-and-pages.yml'
      - 'github_pipeline.py'
      - 'history20.py'
      - 'docs/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-repro.txt'
      - 'repro_lab.py'
      - 'self_evolve.py'
      - 'overfit_guard.py'
      - '.gitignore'
      - 'execution_lab.py'
      - 'h1_evolution_guard.py'
      - 'h1_ml_retrainer.py'
      - 'autonomous_research.py'
      - 'forward_monitor.py'
      - 'forward_supervisor.py'
      - 'FORWARD_SUPERVISOR_GUIDE_JA.md'
      - 'FORWARD_MONITOR_GUIDE_JA.md'
      - 'AUTONOMOUS_RESEARCH_GUIDE_JA.md'
      - 'ml_chart_overlay.py'
      - 'ML_CHART_EXPORT_GUIDE_JA.md'
      - 'broker_h1_oanda.py'
      - 'dukascopy_h1.py'
      - 'docs/annotations.js'
      - 'CHART_ANNOTATIONS_GUIDE_JA.md'
      - 'DUKASCOPY_OFFLINE_GUIDE_JA.md'
      - 'forward_paper.py'
      - 'BROKER_FORWARD_GUIDE_JA.md'
      - '.github/workflows/private-broker-h1-research.yml'
      - '.github/workflows/oanda-offline-policy.yml'
      - 'oanda_policy_audit.py'
      - 'OANDA_OFFLINE_POLICY_GUIDE_JA.md'
      - 'H1_ML_RETRAIN_GUIDE_JA.md'
      - 'research/**'
  schedule:
    # UTC 02:13 = JST 11:13; weekdays. Scheduled jobs may be delayed.
    - cron: '13 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fx-aegis-research-pages
  cancel-in-progress: false

jobs:
  refresh-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Validate zero-dependency dashboard chart engine
        run: |
          node --check docs/chart-model.js
          node --check docs/chart-view.js
          node --check docs/app.js
          node --test tests/test_chart_model.cjs
      - name: Validate manual-only OANDA security gates (offline; no broker API)
        run: python oanda_policy_audit.py
      - name: Install exact reproducibility environment
        run: pip install -r requirements-repro.txt
      - name: Test JS candlesticks and research overlay without network
        run: |
          node --test tests/test_chart_model.cjs tests/test_chart_annotations.cjs
      - name: Generate reproducible synthetic fixture (test-only)
        run: |
          python generate_demo.py
          python main.py --csv data/demo_synthetic_usdjpy.csv --strategy trend --out results/demo_trend
      - name: Run research and simulation tests
        run: python -m unittest discover -s tests -v
      - name: Confirm strictly synthetic Bid/Ask execution semantics (no live feed)
        run: |
          python execution_lab.py fixture --out data/bidask_fixture
          python execution_lab.py validate --quotes data/bidask_fixture/bidask_h1_synthetic.csv --provenance data/bidask_fixture/provenance.json --allow-synthetic --out results/execution_demo
          python execution_lab.py simulate --quotes data/bidask_fixture/bidask_h1_synthetic.csv --provenance data/bidask_fixture/provenance.json --allow-synthetic --slippage-pips-per-side 0.2 --commission-jpy-per-roundtrip 0 --out results/execution_demo
      - name: Audit complete H1 candidate universe on SYNTHETIC test quotes only
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python h1_evolution_guard.py fixture-catalog --out data/bidask_fixture/universe_fixture.json
          python h1_evolution_guard.py audit \
            --quotes data/bidask_fixture/bidask_h1_synthetic.csv \
            --provenance data/bidask_fixture/provenance.json \
            --universe data/bidask_fixture/universe_fixture.json \
            --allow-synthetic --slippage-pips-per-side 0.2 \
            --commission-jpy-per-roundtrip 0 \
            --bootstrap-reps 64 --out results/h1_evolution_fixture.json
          python -c "import json; a=json.load(open('results/h1_evolution_fixture.json')); assert a['status']=='SYNTHETIC_TEST_ONLY' and not a['eligible_for_paper_promotion'] and not a['approved_for_live_trading']"
      - name: ML retraining with strictly SYNTHETIC Bid/Ask fixture; paper/live promotion disabled
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python h1_ml_retrainer.py --quotes data/bidask_fixture/bidask_h1_synthetic.csv \
            --provenance data/bidask_fixture/provenance.json --allow-synthetic \
            --slippage-pips-per-side 0.2 --commission-jpy-per-roundtrip 0 \
            --out results/h1_ml_fixture
          python -c "import json; r=json.load(open('results/h1_ml_fixture/h1_ml_retraining_report.json')); assert r['status']=='SYNTHETIC_TEST_ONLY' and not r['approved_for_live_trading'] and r['sections']['validation']['retrain_events'] > 0"
      - name: Export AI predictions and hypothetical fills to v3.0 chart JSON (SYNTHETIC ONLY)
        run: |
          python ml_chart_overlay.py \
            --quotes data/bidask_fixture/bidask_h1_synthetic.csv \
            --provenance data/bidask_fixture/provenance.json \
            --ml-results results/h1_ml_fixture --allow-synthetic \
            --out results/h1_ml_fixture/annotations.json
          node - <<'JS'
          const fs=require('node:fs');
          const M=require('./docs/chart-model.js');
          const A=require('./docs/annotations.js');
          const bars=M.parseH1Csv(fs.readFileSync('data/bidask_fixture/bidask_h1_synthetic.csv','utf8')).bars;
          const meta=JSON.parse(fs.readFileSync('data/bidask_fixture/provenance.json','utf8'));
          const overlay=A.parse(fs.readFileSync('results/h1_ml_fixture/annotations.json','utf8'),meta.sha256,bars);
          if(overlay.summary.predictions<=0)throw Error('Missing synthetic ML predictions');
          console.log('Synthetic ML-to-chart contract accepted:',overlay.summary.trades,'trades;',overlay.summary.predictions,'predictions.');
          JS
      - name: Autonomous H1 research and evolution audit (SYNTHETIC ONLY, NO ORDERS)
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python autonomous_research.py \
            --quotes data/bidask_fixture/bidask_h1_synthetic.csv \
            --provenance data/bidask_fixture/provenance.json \
            --universe data/bidask_fixture/universe_fixture.json \
            --allow-synthetic --slippage-pips-per-side 0.2 \
            --commission-jpy-per-roundtrip 0 --probability-threshold 0.51 \
            --bootstrap-reps 64 --out results/autonomous_research_ci
          python autonomous_research.py \
            --quotes data/bidask_fixture/bidask_h1_synthetic.csv \
            --provenance data/bidask_fixture/provenance.json \
            --universe data/bidask_fixture/universe_fixture.json \
            --allow-synthetic --slippage-pips-per-side 0.2 \
            --commission-jpy-per-roundtrip 0 --probability-threshold 0.51 \
            --bootstrap-reps 64 --out results/autonomous_research_ci \
            > results/autonomous_research_ci/replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('results/autonomous_research_ci')
          state=json.loads((root/'state.json').read_text())
          summary=json.loads((root/'runs'/state['last_run_id']/'cycle_summary.json').read_text())
          replay=json.loads((root/'replay.json').read_text())
          assert state['run_count']==1 and summary['status']=='SYNTHETIC_TEST_ONLY'
          assert replay['status']=='NO_NEW_H1_BARS'
          assert summary['self_retraining']['validation']['retrain_events']>0
          assert summary['self_evolution']['candidate_family_size']>=4
          assert not summary['approved_for_live_trading']
          assert summary['broker_access']=='DISABLED'
          print('Autonomous SYNTHETIC research completed; replay refused; broker access disabled')
          PY
      - name: Download official FRED DEXJPUS and validate provenance
        run: python github_pipeline.py refresh
      - name: Replay proof and parameter stability scan on verified historical data
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          mkdir -p research
          python repro_lab.py capture --out research/repro_latest.json --fast 15 --slow 100 --allocation 0.25 --spread-pips 1.4
          python repro_lab.py verify --proof research/repro_latest.json
          python repro_lab.py scan --out research/scan_latest.json --seed 42 --spread-pips 1.4
          python repro_lab.py publish --proof research/repro_latest.json --scan research/scan_latest.json --out docs/data/reproducibility.json
      - name: Run evolutionary selection with block-bootstrap multiple-testing guard (fail closed)
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python self_evolve.py --population 16 --generations 5 --seed 42 --seed-mode weekly --spread-pips 1.4
      - name: Produce static read-only website and scenario payload
        run: python github_pipeline.py build
      - name: Persist reference history and publication JSON in Git history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A datasets/fred/dexjpus_daily.csv datasets/fred/metadata.json docs/data/research.json docs/data/reproducibility.json docs/data/evolution.json research/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified FRED USDJPY reference snapshot [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: refresh-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
