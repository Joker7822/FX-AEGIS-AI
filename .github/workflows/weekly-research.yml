name: FX AEGIS AI · Weekly Simulation & Model Smoke Test

on:
  schedule:
    # UTC 02:47 Saturday; latest saved FRED observations are from prior weekdays.
    - cron: '47 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-reference-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-repro.txt
      - name: Simulate retained official daily reference dataset (non-executable scenario)
        run: |
          mkdir -p artifacts
          python github_pipeline.py simulate --dataset datasets/fred/dexjpus_daily.csv --out artifacts/weekly_reference_scenario.json
      - name: Reproduce fixed experiment and scan without future-data selection
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python repro_lab.py capture --out artifacts/repro_proof.json
          python repro_lab.py verify --proof artifacts/repro_proof.json
          python repro_lab.py scan --out artifacts/repro_scan.json
      - name: Weekly deterministic evolution + multiple-testing guard (research only)
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python self_evolve.py --population 16 --generations 5 --seed 42 --seed-mode weekly \
            --report artifacts/evolution_report.json \
            --challenger artifacts/evolution_challenger.json \
            --paper artifacts/paper_champion.json \
            --archive artifacts/evolution_archive.json \
            --site artifacts/evolution_public.json
      - name: Bid/Ask fill and spread test with synthetic-only quotes
        run: |
          python execution_lab.py fixture --out data/bidask_fixture
          python execution_lab.py simulate --quotes data/bidask_fixture/bidask_h1_synthetic.csv --provenance data/bidask_fixture/provenance.json --allow-synthetic --slippage-pips-per-side 0.2 --commission-jpy-per-roundtrip 0 --out artifacts/execution_lab
      - name: Fail-closed H1 execution + evolution regression (synthetic only)
        run: |
          python h1_evolution_guard.py fixture-catalog --out data/bidask_fixture/universe_fixture.json
          python h1_evolution_guard.py audit \
            --quotes data/bidask_fixture/bidask_h1_synthetic.csv \
            --provenance data/bidask_fixture/provenance.json \
            --universe data/bidask_fixture/universe_fixture.json \
            --allow-synthetic --slippage-pips-per-side 0.2 \
            --commission-jpy-per-roundtrip 0 \
            --bootstrap-reps 64 --out artifacts/h1_evolution_fixture.json
      - name: Refit models on strictly SYNTHETIC H1 Bid/Ask with mature labels
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python h1_ml_retrainer.py --quotes data/bidask_fixture/bidask_h1_synthetic.csv \
            --provenance data/bidask_fixture/provenance.json --allow-synthetic \
            --slippage-pips-per-side 0.2 --commission-jpy-per-roundtrip 0 \
            --probability-threshold 0.51 --out artifacts/h1_ml_fixture
          python -c "import json; r=json.load(open('artifacts/h1_ml_fixture/h1_ml_retraining_report.json')); assert r['status']=='SYNTHETIC_TEST_ONLY' and not r['approved_for_live_trading'] and r['sections']['validation']['retrain_events'] > 0"
      - name: Model regression smoke test using explicitly SYNTHETIC H1
        run: |
          python generate_demo.py
          python main.py --csv data/demo_synthetic_usdjpy.csv --strategy trend --out results/demo_trend
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-fx-research-outputs
          path: |
            artifacts/weekly_reference_scenario.json
            artifacts/repro_proof.json
            artifacts/repro_scan.json
            artifacts/evolution_report.json
            artifacts/evolution_public.json
            artifacts/evolution_archive.json
            artifacts/execution_lab/quote_audit.json
            artifacts/execution_lab/execution_report.json
            artifacts/h1_evolution_fixture.json
            artifacts/h1_ml_fixture/h1_ml_retraining_report.json
            results/demo_trend/summary.json
          retention-days: 30
